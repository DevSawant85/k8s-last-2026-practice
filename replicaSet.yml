apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: my-replicas
  labels:
    app: nginx1
    env: prod
    tier: web
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx1
  template:
    metadata:
      labels:
        app: nginx1
    spec:
      containers:
      - name: nginx1
        image: nginx:latest
        ports:
        - containerPort: 80